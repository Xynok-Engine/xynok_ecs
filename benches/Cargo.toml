[package]
name = "xynok_ecs_benches"
version = "0.1.0"
edition = "2024"
publish = false

[lints.clippy]
redundant_field_names = "allow"

[lib]
name = "xynok_ecs_benches"
path = "src/lib.rs"

[dependencies]
xynok_ecs = { path = ".." }
bevy_ecs = "0.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
# The timing harness. Criterion runs the warm-up, picks the iteration counts, collects the samples
# and does the statistics (bootstrapped confidence intervals, outlier classification, comparison
# against the previous run), which is the whole reason this crate no longer hand-rolls any of it.
criterion = { version = "0.8.2", features = ["html_reports"] }

# Reads back what `cargo bench` measured, adds the memory numbers criterion has no opinion about,
# and writes the combined report.
[[bin]]
name = "report"
path = "src/bin/report.rs"

[[bench]]
name = "query"
harness = false
