[workspace]
members = ["proc_macro", "benches"]

[profile.release]
lto = "thin"
codegen-units = 1

[package]
name = "xynok_ecs"
version = "0.1.25"
edition = "2024"

[lints.clippy]
redundant_field_names = "allow"
too_many_arguments = "allow"

[dependencies]
xynok_std = { git = "https://github.com/Xynok-Engine/xynok_std.git", tag = "v0.1.17" }
log = "0.4.33"
thiserror = "2.0.18"
xynok_ecs_proc_macro = { path = "proc_macro" }
# Path chứ không phải git tag như `xynok_std`: hai crate này đang được sửa cùng nhau, và một
# tag mới cho mỗi lần đổi API của pool thì không ai theo kịp. Đổi sang tag khi lane A đứng yên.
xynok_concurrency = { path = "../xynok_concurrency" }
[dev-dependencies]
xynok_ecs = { path = ".", features = ["test-util"] }

[features]
# Read-only introspection into World/Archetype/Chunk internals, used only by the
# integration tests under `tests/` which can't otherwise reach private storage state.
test-util = []
