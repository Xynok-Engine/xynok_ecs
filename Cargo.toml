
[package]
name = "xynok_ecs"
version = "0.1.26"
edition = "2024"

[lints.clippy]
redundant_field_names = "allow"
too_many_arguments = "allow"

[profile.release]
lto = "thin"
codegen-units = 1


[workspace]
members = ["proc_macro", "benches"]

[dependencies]
xynok_std = { git = "https://github.com/Xynok-Engine/xynok_std.git", tag = "v0.1.17" }
xynok_concurrency = { git = "https://github.com/Xynok-Engine/xynok_concurrency.git", tag = "v0.1.81" }
thiserror = "2.0.18"
xynok_ecs_proc_macro = { path = "proc_macro" }

[dev-dependencies]
xynok_ecs = { path = ".", features = ["test-util"] }

[features]
# Read-only introspection into World/Archetype/Chunk internals, used only by the
# integration tests under `tests/` which can't otherwise reach private storage state.
test-util = []
